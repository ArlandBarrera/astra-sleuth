[package]
name = "trend_wasm"
version = "0.1.0"
edition = "2024"
description = "wasm-bindgen bridge: Earth System Trend Detective statistics engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mann_kendall = { path = "../mann_kendall" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
